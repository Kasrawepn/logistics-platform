services:
  web:
    image: node:22-alpine
    labels:
      base44.project: "DentOrbit Dental Clinic"
      base44.kind: web
      base44.port: "3000"
    working_dir: /app
    command: ["node", "dev-server.mjs"]
    environment:
      PORT: "3000"
      APP_DIR: /app/dental-clinic
    env_file:
      # Platform-managed secrets (e.g. PAYPAL_CLIENT_ID). Optional so the stack
      # boots before any secret exists; the app then uses test-payment mode.
      - path: /run/base44/app.env
        required: false
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
