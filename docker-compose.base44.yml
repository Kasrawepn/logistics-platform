# Base44 development environment.
# Runs the AYDIN TRANSPORT & LOGISTIK website straight from the cloned source (bind mount),
# so every edit to website/ is visible on refresh without rebuilding an image.
name: horizon-logistics

services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./docker/nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/ | grep -qi 'aydin' || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Delivers the contact form to the owner's inbox over SMTP (Gmail by default).
  # The site never depends on this service: `web` starts without it and keeps serving, and
  # the form reports that sending failed instead of pretending it worked. It is therefore
  # deliberately not wired as a `web` dependency.
  api:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    volumes:
      - ./server:/app
      - contact_api_modules:/app/node_modules
    environment:
      PORT: 8080
      CONTACT_TO: Aydinmuhammet601@gmail.com
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "npm ci --omit=dev --no-audit --no-fund && exec node server.js"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/api/health | grep -q '\"ok\":true' || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s

volumes:
  # Installed at container start from server/package-lock.json — keeps the repo clean.
  contact_api_modules:
