# Static dev server for the HORIZON LOGISTICS site.
# Files are read from disk on every request, so edits appear on refresh.
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Clean URLs: /services -> /services.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Never cache during development; always serve the current file.
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|webp|avif|svg|gif|ico|woff2?|ttf)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
}
