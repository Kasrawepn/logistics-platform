# Static dev server for the HORIZON LOGISTICS site.
# Files are read from disk on every request, so edits appear on refresh.
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Clean URLs: /services -> /services.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Contact form endpoint. The static site posts to /api/contact on its own origin and
    # nginx forwards it to the `api` service, so the browser never needs CORS.
    # The upstream name is resolved per request (Docker's embedded DNS), so nginx starts
    # and keeps serving the site even while the mail service is down or still installing.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $contact_api http://api:8080;
        proxy_pass $contact_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Never cache during development; always serve the current file.
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|png|webp|avif|svg|gif|ico|woff2?|ttf)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
}
